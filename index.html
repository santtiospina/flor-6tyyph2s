<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FBF8F2">
  <title>Álbum</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28c0-8 1-14 5-21' fill='none' stroke='%231F4B4C' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M17 20c-4-.3-6.500-2.300-7.500-5.500 4 0 6.800 1.800 7.500 5.500zM18 14c3.500-.8 5.500-3 5.700-6.500-3.600.8-5.700 3-5.700 6.500z' fill='%23A9B79F'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/GrenzeGotisch-normal-400-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/EBGaramond-normal-400-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/EBGaramond-italic-400-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/DMMono-normal-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

  <!-- Botanical art: each slot is filled by art.js (real files in /art, or procedural placeholders) -->
  <div class="art-layer" aria-hidden="true">
    <div class="art art-tl" data-art="corner-a"></div>
    <div class="art art-tr" data-art="corner-b"></div>
    <div class="art art-bl" data-art="corner-b"></div>
    <div class="art art-br" data-art="corner-a"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <div id="veil" class="veil" role="status">
    <div class="bloom" aria-hidden="true"></div>
    <p class="veil-text">revelando…</p>
  </div>

  <main id="app">
    <section id="view-intro" class="view view-intro" hidden></section>
    <section id="view-menu" class="view view-menu" hidden></section>
    <section id="view-section" class="view view-section" hidden></section>
  </main>

  <button id="back" class="back" type="button" hidden aria-label="Volver al índice del álbum">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><use href="#i-arrow"/></svg>
    <span>Índice</span>
  </button>

  <aside id="panel" class="panel" data-state="hidden" aria-label="Textos de las fotos" hidden>
    <button id="panel-head" class="panel-head" type="button" aria-expanded="false" aria-controls="panel-body">
      <span class="grip" aria-hidden="true"></span>
      <span class="panel-title">Recuerdos</span>
      <span class="panel-count mono" id="panel-count"></span>
      <svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><use href="#i-chev"/></svg>
    </button>
    <div id="panel-body" class="panel-body" aria-live="polite">
      <p class="panel-empty">Toca una foto y su historia aparecerá aquí.</p>
      <div class="entries" id="entries"></div>
    </div>
  </aside>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-sprig" viewBox="0 0 24 24">
        <path d="M12 22c0-6.500.6-11.500 3-18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M12.300 16.500C9.400 16.300 7.300 14.700 6.500 11.700c3 0 5.500 1.500 5.800 4.800zM13.200 12c2.800-.7 4.500-2.600 4.800-5.500-2.900.7-4.700 2.700-4.800 5.500zM14.400 8.200c-2-1.300-2.700-3.300-2.200-5.500 2.100 1.200 2.900 3.100 2.200 5.500z" fill="currentColor" fill-opacity=".85"/>
      </symbol>
    </defs>
  </svg>

  <noscript><p class="noscript">Este álbum necesita JavaScript para revelar las fotos.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
